version: "2.1"

services:
  # https://docs.frigate.video/frigate/installation#docker
  frigate:
    build: .
    privileged: true
    restart: unless-stopped
    ports:
      - "8971:8971"
      - "5000:5000" # Internal unauthenticated access. Expose carefully.
      - "8554:8554" # RTSP feeds
      - "8555:8555/tcp" # WebRTC over tcp
      - "8555:8555/udp" # WebRTC over udp
    volumes:
      - config:/config
      - media:/media/frigate
    tmpfs:
      - /tmp/cache:size=256m
    shm_size: 256M
    environment:
      CONFIG_FILE: "/config/frigate.yml"
      YOLO_MODELS: "yolov7-tiny-416"
      USE_FP16: "true"
      UDEV: "1"
    labels:
      io.balena.features.kernel-modules: 1
      io.balena.features.sysfs: 1

  proxy:
    build: ./proxy
    restart: unless-stopped
    network_mode: host
    depends_on:
      - frigate
    environment:
      FRIGATE_HOST: "127.0.0.1:5000"

  # https://github.com/balenablocks/hostname
  hostname:
    image: balenablocks/hostname@sha256:b923d6ea886ec48125d2c49e431638d2ef6f4adac574b729b4135cfade3ffdce
    restart: no
    labels:
      io.balena.features.supervisor-api: 1
    environment:
      SET_HOSTNAME: frigate

  # # https://hub.docker.com/r/mrlt8/wyze-bridge/tags
  # wyze-bridge:
  #   image: mrlt8/wyze-bridge:2.10.3@sha256:af2d638a6d6d52e15ddcfb711e5b905e484b1f519986ad33b9be562b6277b987
  #   volumes:
  #     - tokens:/tokens

volumes:
  config:
  media:
  # tokens:
