name: "Frigate"
type: "sw.application"
# renovate: datasource=docker depName=ghcr.io/blakeblackshear/frigate
version: 0.15.2-tensorrt-jp4
description: "A complete and local NVR designed for Home Assistant with AI object detection, optimized for NVIDIA Jetson Nano (JetPack 4.6 / L4T R32.7)."
post-provisioning: >-
  ## Usage instructions

  Once your device joins the fleet you'll need to allow some time for it to download the application and generate the TensorRT model on first boot.

  When it's done you should be able to access the app at http://frigate.local (or port 5000).

  Additional usage instructions for Frigate can be found here: <https://blakeblackshear.github.io/frigate/>.

assets:
  repository:
    type: "blob.asset"
    data:
      url: "https://github.com/nikil511/balena-frigate"
  logo:
    type: "blob.asset"
    data:
      url: "https://raw.githubusercontent.com/nikil511/balena-frigate/main/logo.png"
data:
  defaultDeviceType: "jetson-nano"
  supportedDeviceTypes:
    - "jetson-nano"
    - "jetson-nano-emmc"
    - "jetson-nano-2gb-devkit"
