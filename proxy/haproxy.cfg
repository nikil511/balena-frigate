global
    log stdout format raw local0 info
    maxconn 1024

defaults
    log     global
    mode    http
    option  dontlognull
    option  httplog
    option  redispatch
    option  forwardfor
    timeout connect 5s
    timeout queue   5s
    timeout client  60s
    timeout server  60s
    timeout tunnel  3600s

frontend http_in
    bind *:80

    # Forward standard reverse-proxy headers for Balena tunnel & LAN
    http-request set-header X-Forwarded-Proto https if { hdr_end(Host) -i balena-devices.com }
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Real-IP %[src]

    # Quick-switch entry routes:
    # - /frigate  -> clears camera cookie and opens Frigate UI at /
    # - /camera1  -> selects Camera 1 (CAMERA1_HOST) and opens camera login UI
    # - /camera2  -> selects Camera 2 (CAMERA2_HOST) and opens camera login UI
    acl is_frigate_reset path -i /frigate /frigate/
    acl is_cam1_entry    path -i /camera1 /camera1/ /cam1 /cam1/
    acl is_cam2_entry    path -i /camera2 /camera2/ /cam2 /cam2/

    http-request return status 302 hdr Location "/" hdr Set-Cookie "cam_target=; Path=/; Max-Age=0" if is_frigate_reset
    http-request return status 302 hdr Location "/doc/page/login.asp" hdr Set-Cookie "cam_target=camera1; Path=/" if is_cam1_entry
    http-request return status 302 hdr Location "/doc/page/login.asp" hdr Set-Cookie "cam_target=camera2; Path=/" if is_cam2_entry

    # Explicit subpath prefixes (/camera1/..., /camera2/..., /router/...)
    acl is_cam1_path   path_beg -i /camera1/ /cam1/
    acl is_cam2_path   path_beg -i /camera2/ /cam2/
    acl is_router_path path -i /router /router/
    acl is_router_path path_beg -i /router/

    # Camera root-relative asset/API/WebSocket paths (/doc/*, /ISAPI/*, /SDK/*, /webSocketServer*)
    acl is_hikvision_asset path_beg -i /doc/ /ISAPI/ /SDK/ /webSocketServer /onvif/ /PSIA/
    acl is_cam1_cookie     req.cook(cam_target) -m str camera1

    use_backend backend_camera1 if is_cam1_path
    use_backend backend_camera2 if is_cam2_path
    use_backend backend_camera1 if is_hikvision_asset is_cam1_cookie
    use_backend backend_camera2 if is_hikvision_asset
    use_backend backend_router  if is_router_path

    default_backend backend_frigate

backend backend_frigate
    mode http
    option forwardfor
    server frigate "${FRIGATE_HOST}" check inter 5s fall 3 rise 1

backend backend_camera1
    mode http
    option forwardfor
    http-request replace-path ^/(camera1|cam1)/?(.*)$ /\2
    server camera1 "${CAMERA1_HOST}" check inter 10s fall 3 rise 1

backend backend_camera2
    mode http
    option forwardfor
    http-request replace-path ^/(camera2|cam2)/?(.*)$ /\2
    server camera2 "${CAMERA2_HOST}" check inter 10s fall 3 rise 1

backend backend_router
    mode http
    option forwardfor
    http-request replace-path ^/router/?(.*)$ /\1
    server router "${ROUTER_HOST}" check inter 10s fall 3 rise 1
